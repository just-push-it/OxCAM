name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    env:
      # Tests run in parallel, one per core of the hosted runners.
      CTEST_PARALLEL_LEVEL: 4
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: ci-msvc-headless, triplet: x64-windows, python: true }
          - { os: ubuntu-24.04, preset: ci-linux-gcc-headless, triplet: x64-linux, python: true }
          - { os: ubuntu-24.04, preset: ci-linux-clang-headless, triplet: x64-linux }
          - { os: ubuntu-24.04, preset: ci-linux-clang-asan, triplet: x64-linux }
          - { os: macos-15, preset: ci-macos-clang-headless, triplet: arm64-osx }
          - { os: windows-2022, preset: ci-msvc-gui, triplet: x64-windows }
          - { os: ubuntu-24.04, preset: ci-linux-gcc-gui, triplet: x64-linux, test-wrapper: xvfb-run -a }
          - { os: macos-15, preset: ci-macos-clang-gui, triplet: arm64-osx }
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        # Ninja plus the system packages vcpkg needs for OpenCASCADE and Qt (X11/xcb, GL,
        # autotools); xvfb provides a display for the GUI smoke test.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf autoconf-archive automake libtool \
            pkg-config bison python3-venv libx11-dev libxext-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libxrender-dev libx11-xcb-dev '^libxcb.*-dev' \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libglu1-mesa-dev \
            libegl1-mesa-dev libfontconfig1-dev xvfb

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # VsDevCmd is what ilammy/msvc-dev-cmd ran. That action is still Node 20 and has
      # no Node 24 release, so the developer environment is imported here instead.
      # It also exports Visual Studio's own VCPKG_ROOT; the next step puts back the
      # clone this workflow bootstraps, or git clone targets the VS tree and fails.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $install) { throw 'Visual Studio with the VC toolset was not found' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          $lines = & cmd.exe /d /c "`"$devcmd`" -no_logo -arch=x64 -host_arch=x64 >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd.bat failed with exit code $LASTEXITCODE" }
          $delim = 'OXCAM_ENV_EOF'
          foreach ($line in $lines) {
            $line = $line -replace "`r$", ''
            if ($line -notmatch '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') { continue }
            $name = $Matches[1]
            $value = $Matches[2]
            if ($name -like 'GITHUB_*' -or $value.Contains($delim)) { continue }
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "$name<<$delim`n$value`n$delim`n")
          }
      - name: Restore vcpkg root after MSVC setup
        if: runner.os == 'Windows'
        shell: bash
        run: |
          {
            echo "VCPKG_ROOT<<EOF"
            echo "${{ github.workspace }}/../vcpkg"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ matrix.preset }}-
            vcpkg-${{ matrix.triplet }}-

      - name: Set up Python for the bindings
        if: matrix.python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install nanobind
        if: matrix.python
        run: python -m pip install "nanobind==2.13.0"

      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.python }}" = "true" ]; then
            extra="-DOCAM_BUILD_PYTHON=ON -DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')"
          fi
          cmake --preset ${{ matrix.preset }} $extra

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ${{ matrix.test-wrapper }} ctest --preset ${{ matrix.preset }}

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
            build/**/vcpkg-manifest-install.log
          if-no-files-found: ignore

  lint:
    name: lint (format, REUSE, DCO)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: clang-format
        run: |
          files=$(git ls-files '*.cpp' '*.hpp' '*.h')
          clang-format-18 --version
          clang-format-18 --dry-run --Werror $files

      - name: REUSE compliance
        uses: fsfe/reuse-action@v6

      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        run: |
          missing=0
          for sha in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
